<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreador de Odds BTTS - Premium v3</title>
    <style>
        :root {
            --bg-main: #121214;
            --bg-card: #202024;
            --bg-input: #121214;
            --border-color: #29292e;
            --text-main: #ffffff;
            --text-muted: #a8a8b3;
            --color-accent: #633bbc;
            --color-green: #04d361;
            --color-red: #b83232;
            --color-yellow: #f1c40f;
            --color-blue: #0077ff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        .card-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-header-actions h2 {
            margin: 0;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
        }

        .header-efficiency-display {
            font-size: 11px;
            font-weight: bold;
            color: var(--color-blue);
            background: rgba(0, 119, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(0, 119, 255, 0.3);
            text-transform: none;
            letter-spacing: 0px;
            margin-left: auto;
            white-space: nowrap;
        }

        .scroll-buttons {
            display: flex;
            gap: 4px;
        }

        .btn-scroll {
            background: #2d2d34;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-scroll:hover { background: var(--color-accent); }

        .odds-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-height: 230px; 
            overflow-y: auto;
            padding-right: 4px;
            scroll-behavior: smooth;
        }

        .odds-grid::-webkit-scrollbar, .stats-balloons-vertical::-webkit-scrollbar {
            width: 4px;
        }
        .odds-grid::-webkit-scrollbar-thumb, .stats-balloons-vertical::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 4px;
        }

        .odd-box {
            background-color: #2d2d34;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 4px;
            text-align: center;
            border-radius: 6px;
            user-select: none;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            position: relative;
            box-sizing: border-box;
            cursor: pointer;
        }

        .odd-val-display {
            font-weight: bold;
            font-size: 11px;
            white-space: nowrap;
        }

        .odd-time-display {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: normal;
        }

        .odd-placar-input {
            width: 80%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 11px;
            padding: 2px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            box-sizing: border-box;
        }
        .odd-placar-input:focus {
            outline: none;
            border-color: var(--color-accent);
            background: #000;
        }

        @keyframes balaoPisca {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .odd-box.piscando-favorito {
            animation: balaoPisca 1.6s infinite ease-in-out;
            border-color: #ffffff !important;
        }

        .odd-box.alerta-repeticao {
            border: 5px solid var(--color-yellow) !important;
            box-shadow: 0 0 6px rgba(241, 196, 15, 0.4);
        }

        .odd-box.selecionada-azul {
            border: 4px solid var(--color-blue) !important;
            box-shadow: 0 0 10px rgba(0, 119, 255, 0.8) !important;
        }

        .odd-box.green {
            background-color: var(--color-green) !important;
            color: #000000 !important;
        }
        .odd-box.green .odd-time-display {
            color: #202024 !important;
            font-weight: bold;
        }
        .odd-box.green .odd-placar-input {
            color: #000000;
            border-color: rgba(0,0,0,0.2);
            background: rgba(255,255,255,0.4);
        }

        .odd-box.red {
            background-color: var(--color-red) !important;
            color: #ffffff !important;
            font-weight: bold; 
        }
        .odd-box.red .odd-time-display {
            color: #ffffff !important;
            font-weight: bold;
        }
        .odd-box.red .odd-placar-input {
            color: #ffffff;
            border-color: rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.4);
        }

        .banca-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        .banca-input-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .banca-input-group label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: bold;
        }
        .banca-input-group input {
            width: 100%;
            padding: 7px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            box-sizing: border-box;
            text-align: center;
        }
        .banca-input-group input:focus {
            outline: none;
            border-color: var(--color-accent);
        }
        .stakes-table {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-top: 8px;
        }
        .stake-box {
            background: #1a1a1e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px 4px;
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .stake-box span {
            display: block;
            font-size: 9px;
            color: var(--text-muted);
            margin-bottom: 2px;
        }
        .input-stake-custom {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--color-green);
            font-size: 11px;
            font-weight: bold;
            padding: 2px;
            border-radius: 4px;
            text-align: center;
            box-sizing: border-box;
        }
        .input-stake-custom:focus {
            outline: none;
            border-color: var(--color-accent);
            background: #000;
        }

        .vacuo-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #1a1a1e;
            padding: 10px 12px;
            border-radius: 6px;
            margin-top: 10px;
            border: 1px dashed var(--border-color);
            font-size: 11px;
            box-sizing: border-box;
        }
        .vacuo-linha {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .vacuo-linha span {
            font-weight: bold;
            color: var(--color-accent);
        }
        .vacuo-badge {
            background: #2d2d34;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color);
        }

        .stats-balloons-vertical {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 4px;
            scroll-behavior: smooth;
        }

        .balloon-row {
            background: var(--bg-input);
            border-radius: 12px;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
            transition: background 0.2s;
            box-sizing: border-box;
        }

        .balloon-row.focado {
            background: #2a2240;
            border-color: var(--color-accent);
        }

        .balloon-label {
            font-size: 11px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        .balloon-value {
            font-size: 13px;
            font-weight: bold;
            color: var(--color-green);
        }

        #oddInput {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-input);
            color: var(--text-main);
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        #oddInput:focus {
            outline: none;
            border-color: var(--color-accent);
        }

        .btn-clear {
            width: 100%;
            padding: 8px;
            background-color: #2a2a30;
            border: 1px solid #444;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            box-sizing: border-box;
        }
        .btn-clear:hover { background-color: #3f3f46; }

        .teams-section {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .team-input {
            flex: 1;
            width: 0;
            padding: 8px 6px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 11px;
            box-sizing: border-box;
        }
        .team-input:focus {
            outline: none;
            border-color: var(--color-accent);
        }
        .action-buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }
        .btn-action {
            padding: 8px 4px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid var(--border-color);
            text-align: center;
            box-sizing: border-box;
        }
        .btn-enviar-sinal { background-color: var(--color-blue); color: #fff; border: none; }
        .btn-enviar-sinal:hover { background-color: #0056b3; }
        .btn-limpar-nomes { background-color: #2a2a30; color: #fff; }
        .btn-limpar-nomes:hover { background-color: #3f3f46; }
        .btn-registrar-time { background-color: var(--color-accent); color: #fff; border: none; }
        .btn-registrar-time:hover { background-color: #512da8; }

        .preview-telegram-box {
            background: #111115;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px;
            margin-top: 8px;
            font-size: 10px;
            color: var(--text-muted);
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- GRADE DE ODDS -->
    <div class="card">
        <div class="card-header-actions">
            <h2>📊 Odds Adicionadas</h2>
            <div class="scroll-buttons">
                <button class="btn-scroll" onclick="rolarContainer('gridOdds', -60)">▲</button>
                <button class="btn-scroll" onclick="rolarContainer('gridOdds', 60)">▼</button>
            </div>
        </div>
        <div class="odds-grid" id="gridOdds"></div>
    </div>

    <!-- ENTRADA, GESTÃO DE BANCA E TELEGRAM -->
    <div class="card">
        <div class="card-header-actions" style="display: flex; align-items: center; justify-content: space-between;">
            <h2 style="display: flex; align-items: center; gap: 6px; width: auto; margin: 0;">
                ⌨️ Entrada de Dados
                <span id="eficienciaHeaderDisplay" class="header-efficiency-display" style="display: none;"></span>
            </h2>
            <button class="btn-action btn-enviar-sinal" style="padding: 4px 12px; font-size: 11px; border-radius: 4px;" onclick="enviarSinalTelegram()">Enviar</button>
        </div>

        <div class="banca-grid" style="margin-top: 12px;">
            <div class="banca-input-group">
                <label>Valor da Banca (R$)</label>
                <input type="number" id="inputBanca" value="100" oninput="calcularStakes()">
            </div>
            <div class="banca-input-group">
                <label>Lucro Alvo / Obs</label>
                <input type="text" id="inputPorcentagem" value="Martingale" disabled style="color: var(--text-muted); background: #18181b;">
            </div>
        </div>
        <div class="stakes-table">
            <div class="stake-box">
                <span>Principal</span>
                <input type="number" id="inputStake1" class="input-stake-custom" value="10.00" step="0.5" oninput="calcularStakesManual()">
            </div>
            <div class="stake-box">
                <span>1º Mart.</span>
                <input type="number" id="inputStake2" class="input-stake-custom" value="20.00" step="0.5" oninput="calcularStakesManual()">
            </div>
            <div class="stake-box">
                <span>2º Mart.</span>
                <input type="number" id="inputStake3" class="input-stake-custom" value="40.00" step="0.5" oninput="calcularStakesManual()">
            </div>
            <div class="stake-box">
                <span>3º Mart.</span>
                <input type="number" id="inputStake4" class="input-stake-custom" value="80.00" step="0.5" oninput="calcularStakesManual()">
            </div>
        </div>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 12px 0;">

        <input type="number" id="oddInput" placeholder="Ex: 0022123456" autocomplete="off">
        
        <div class="teams-section">
            <input type="text" id="timeUmInput" class="team-input" placeholder="Time da Casa" list="listaTimesRegistrados" autocomplete="off" oninput="atualizarPreviewTelegram()">
            <input type="text" id="timeDoisInput" class="team-input" placeholder="Time Visitante" list="listaTimesRegistrados" autocomplete="off" oninput="atualizarPreviewTelegram()">
            <datalist id="listaTimesRegistrados"></datalist>
        </div>

        <div class="action-buttons-grid">
            <button class="btn-action btn-limpar-nomes" onclick="limparNomesTimes()">Limpar Nomes</button>
            <button class="btn-action btn-registrar-time" onclick="registrarTimesDB()">Registrar</button>
            <button class="btn-action btn-enviar-sinal" onclick="enviarSinalTelegram()">Enviar Sinal</button>
        </div>

        <div style="margin-top: 8px; font-size: 10px; color: var(--text-muted); font-weight: bold;">Pré-visualização do Telegram:</div>
        <div id="previewTelegram" class="preview-telegram-box">Carregando preview...</div>

        <div class="vacuo-container">
            <div class="vacuo-linha">
                <div>Odd Alvo (Gatilho Atual):</div>
                <span id="ultOddGreen" class="vacuo-badge">-</span>
            </div>
            <div class="vacuo-linha">
                <div>Histórico de Resposta (Casas):</div>
                <span id="historicoSequencia" style="color: var(--text-muted); font-size: 11px; text-align: right; font-weight: bold;">Nenhum dado</span>
            </div>
        </div>
        
        <button class="btn-clear" onclick="limparHistorico()">Limpar Todo o Histórico</button>
    </div>

    <!-- RANKING DE EFICIÊNCIA -->
    <div class="card">
        <div class="card-header-actions">
            <h2>🏆 Ranking de Eficiência das Odds</h2>
            <div class="scroll-buttons">
                <button class="btn-scroll" onclick="rolarContainer('rankingBalloonsContainer', -50)">▲</button>
                <button class="btn-scroll" onclick="rolarContainer('rankingBalloonsContainer', 50)">▼</button>
            </div>
        </div>
        <div class="stats-balloons-vertical" id="rankingBalloonsContainer"></div>
    </div>

</div>

<script>
    const TELEGRAM_TOKEN = "8427077212:AAEiL_3_D_-fukuaR95V3FqoYYyHvdCHmEI";
    const TELEGRAM_CHAT_ID = "-1003355965894";

    let bancoOdds = JSON.parse(localStorage.getItem('banco_odds_btts')) || [];
    let listaTimesDB = JSON.parse(localStorage.getItem('banco_times_registrados')) || [];
    let listaFavoritosAtuais = []; 
    let cacheRankingMapeado = {}; 
    let oddSelecionadaAzul = null;

    let estagioCiclo = 0; 

    const oddInput = document.getElementById('oddInput');
    const gridOdds = document.getElementById('gridOdds');
    const rankingContainer = document.getElementById('rankingBalloonsContainer');
    const eficienciaHeaderDisplay = document.getElementById('eficienciaHeaderDisplay');
    const timeUmInput = document.getElementById('timeUmInput');
    const timeDoisInput = document.getElementById('timeDoisInput');
    const datalistTimes = document.getElementById('listaTimesRegistrados');
    const previewTelegram = document.getElementById('previewTelegram');
    
    const inputBanca = document.getElementById('inputBanca');
    const inputStake1 = document.getElementById('inputStake1');
    const inputStake2 = document.getElementById('inputStake2');
    const inputStake3 = document.getElementById('inputStake3');
    const inputStake4 = document.getElementById('inputStake4');

    window.onload = function() {
        atualizarPainelDinamico(); 
        renderizarGrade(true);
        atualizarDatalistTimes();
        atualizarPreviewTelegram();
        
        oddInput.addEventListener('input', function(e) {
            let valor = e.target.value;
            if (valor.length === 10) {
                let min_p1 = valor.substring(0, 2);
                let min_p2 = valor.substring(2, 4);
                let sim_p1 = valor.substring(4, 5);
                let sim_p2 = valor.substring(5, 7);
                let nao_p1 = valor.substring(7, 8);
                let nao_p2 = valor.substring(8, 10);
                
                let tempoFormatated = `${min_p1}:${min_p2}`;
                let oddFormatada = `${sim_p1}.${sim_p2} x ${nao_p1}.${nao_p2}`;
                
                adicionarOdd(oddFormatada, tempoFormatated);
                e.target.value = '';
            }
        });
    };

    function calcularStakesManual() {
        let principal = parseFloat(inputStake1.value) || 0;
        inputStake2.value = (principal * 2).toFixed(2);
        inputStake3.value = (principal * 4).toFixed(2);
        inputStake4.value = (principal * 8).toFixed(2);
        atualizarPreviewTelegram();
    }

    function calcularStakes() {
        calcularStakesManual();
    }

    function obterDadosStakeAtual() {
        let s1 = parseFloat(inputStake1.value) || 0;
        let s2 = parseFloat(inputStake2.value) || 0;
        let s3 = parseFloat(inputStake3.value) || 0;
        let s4 = parseFloat(inputStake4.value) || 0;

        if (estagioCiclo === 0) return { nome: "Entrada Principal", valor: s1 };
        if (estagioCiclo === 1) return { nome: "1º Martingale", valor: s2 };
        if (estagioCiclo === 2) return { nome: "2º Martingale", valor: s3 };
        if (estagioCiclo === 3) return { nome: "3º Martingale", valor: s4 };
        return { nome: "Entrada Principal", valor: s1 };
    }

    function atualizarDatalistTimes() {
        datalistTimes.innerHTML = '';
        listaTimesDB.forEach(time => {
            let option = document.createElement('option');
            option.value = time;
            datalistTimes.appendChild(option);
        });
    }

    function registrarTimesDB() {
        let t1 = timeUmInput.value.trim();
        let t2 = timeDoisInput.value.trim();
        if(!t1 || !t2) {
            alert("Preencha ambos os nomes dos times para registrar.");
            return;
        }
        if(!listaTimesDB.includes(t1)) listaTimesDB.push(t1);
        if(!listaTimesDB.includes(t2)) listaTimesDB.push(t2);
        localStorage.setItem('banco_times_registrados', JSON.stringify(listaTimesDB));
        atualizarDatalistTimes();
        alert("Times registrados com sucesso!");
    }

    function limparNomesTimes() {
        timeUmInput.value = '';
        timeDoisInput.value = '';
        atualizarPreviewTelegram();
    }

    function dispararMensagemTelegram(texto) {
        let url = `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(texto)}&parse_mode=Markdown`;
        fetch(url).catch(err => console.error("Erro ao enviar Telegram:", err));
    }

    function calcularRetornoEstimado(oddStr, stakeVal) {
        let limpo = oddStr.replace(',', '.');
        let match = limpo.match(/([0-9]+\.[0-9]+)/);
        let numOdd = match ? parseFloat(match[1]) : 1.50;
        let retorno = stakeVal * numOdd;
        return retorno.toFixed(2);
    }

    function montarTextoMensagem() {
        let t1 = timeUmInput.value.trim() || "Time A";
        let t2 = timeDoisInput.value.trim() || "Time B";
        
        let oddAlvoObj = null;
        let ultimoIndexPreenchido = -1;

        for (let i = bancoOdds.length - 1; i >= 0; i--) {
            if (bancoOdds[i].placar && bancoOdds[i].placar.trim() !== '') {
                ultimoIndexPreenchido = i;
                break;
            }
        }

        if (ultimoIndexPreenchido !== -1 && ultimoIndexPreenchido + 1 < bancoOdds.length) {
            oddAlvoObj = bancoOdds[ultimoIndexPreenchido + 1];
        } else if (bancoOdds.length > 0) {
            oddAlvoObj = bancoOdds[bancoOdds.length - 1];
        }

        let oddValor = oddAlvoObj ? oddAlvoObj.valor : "1.50";
        let tempoJogo = oddAlvoObj ? oddAlvoObj.tempo : "00:00";
        
        let stakeInfo = obterDadosStakeAtual();
        let valorStake = stakeInfo.valor;
        let retornoEstimado = calcularRetornoEstimado(oddValor, valorStake);

        let mensagem = "";
        let cabecalhoVirt = "🚨 *NOVO SINAL - FUTEBOL VIRTUAL (PREMIER LEAGUE)* 🚨\n\n";

        if (estagioCiclo === 0) {
            mensagem = `${cabecalhoVirt}⚽ *${t1} vs ${t2}*\n⏱ Próximo Jogo: ${tempoJogo}\n📊 Odd: ${oddValor}\n\n💰 *Entrada Principal*\n💵 Valor Sugerido: R$ ${valorStake.toFixed(2)}\n📈 Retorno Estimado: R$ ${retornoEstimado}`;
        } else {
            let nomeMart = estagioCiclo === 1 ? "1º Martingale" : (estagioCiclo === 2 ? "2º Martingale" : "3º Martingale");
            mensagem = `${cabecalhoVirt}⚠️ *NÃO BATEU AMBAS - ${nomeMart.toUpperCase()}* ⚠️\n\nA entrada anterior não bateu. Vamos para o *${nomeMart}* (Ambas Marcam).\n\n⚽ *${t1} vs ${t2}*\n⏱ Próximo Jogo: ${tempoJogo}\n📊 Odd Atual: ${oddValor}\n💵 Stake (${nomeMart}): R$ ${valorStake.toFixed(2)}\n📈 Retorno Estimado: R$ ${retornoEstimado}`;
        }
        return mensagem;
    }

    function atualizarPreviewTelegram() {
        if(previewTelegram) {
            previewTelegram.innerText = montarTextoMensagem();
        }
    }

    function enviarSinalTelegram() {
        let mensagem = montarTextoMensagem();
        dispararMensagemTelegram(mensagem);
        alert("Sinal enviado ao Telegram!");
    }

    function adicionarOdd(valorOdd, tempoOdd) {
        bancoOdds.push({
            id: Date.now() + '-' + Math.floor(Math.random() * 100000),
            valor: valorOdd,
            tempo: tempoOdd,
            placar: '', 
            status: 0 
        });
        salvarEAtualizar(true);
    }

    function calcularStatusPorPlacar(placarStr) {
        let numeros = placarStr.replace(/\D/g, '');
        if (numeros.length < 2) return 0; 

        let golsTime1 = parseInt(numeros.substring(0, 1));
        let golsTime2 = parseInt(numeros.substring(1, 2));

        if (golsTime1 > 0 && golsTime2 > 0) {
            return 1; // Green
        } else {
            return 2; // Red
        }
    }

    function tratarInputPlacar(event, id) {
        let input = event.target;
        let valor = input.value.replace(/\D/g, ''); 

        if (valor.length >= 2) {
            valor = valor.substring(0, 2);
            valor = valor.substring(0, 1) + ' : ' + valor.substring(1, 2);
        }

        input.value = valor;

        const indice = bancoOdds.findIndex(o => o.id === id);
        if (indice !== -1) {
            bancoOdds[indice].placar = valor;
            let novoStatus = calcularStatusPorPlacar(valor);
            bancoOdds[indice].status = novoStatus;
            
            localStorage.setItem('banco_odds_btts', JSON.stringify(bancoOdds));
            atualizarPainelDinamico();
            
            let boxPai = input.closest('.odd-box');
            let mensagemParaEnviar = "";

            if (boxPai) {
                boxPai.classList.remove('green', 'red');
                let cabecalhoVirt = "🚨 *FUTEBOL VIRTUAL (PREMIER LEAGUE)* 🚨\n\n";

                if (novoStatus === 1) {
                    boxPai.classList.add('green');
                    let t1 = timeUmInput.value.trim() || "Time A";
                    let t2 = timeDoisInput.value.trim() || "Time B";
                    let oddVal = bancoOdds[indice].valor;
                    let stakeInfo = obterDadosStakeAtual();
                    let retornoEstimado = calcularRetornoEstimado(oddVal, stakeInfo.valor);
                    
                    mensagemParaEnviar = `${cabecalhoVirt}✅ *BATEU AMBAS MARCAM!* ✅\n\n⚽ *${t1} vs ${t2}*\n📊 Odd: ${oddVal}\n🎯 Placar: ${valor}\n💵 Stake: R$ ${stakeInfo.valor.toFixed(2)} (${stakeInfo.nome})\n📈 Retorno: R$ ${retornoEstimado}`;
                    estagioCiclo = 0;
                } else if (novoStatus === 2) {
                    boxPai.classList.add('red');
                    if (estagioCiclo < 3) {
                        estagioCiclo++;
                        let nomeMart = estagioCiclo === 1 ? "1º Martingale" : (estagioCiclo === 2 ? "2º Martingale" : "3º Martingale");
                        let t1 = timeUmInput.value.trim() || "Time A";
                        let t2 = timeDoisInput.value.trim() || "Time B";
                        let oddVal = bancoOdds[indice].valor;
                        let stakeInfo = obterDadosStakeAtual();
                        let retornoEstimado = calcularRetornoEstimado(oddVal, stakeInfo.valor);
                        mensagemParaEnviar = `${cabecalhoVirt}⚠️ *NÃO BATEU AMBAS - ${nomeMart.toUpperCase()}* ⚠️\n\nA entrada anterior não bateu. Vamos para o *${nomeMart}* (Ambas Marcam).\n\n⚽ *${t1} vs ${t2}*\n⏱ Próximo Jogo: ${bancoOdds[indice].tempo}\n📊 Odd Atual: ${oddVal}\n💵 Stake (${nomeMart}): R$ ${stakeInfo.valor.toFixed(2)}\n📈 Retorno Estimado: R$ ${retornoEstimado}`;
                    } else {
                        mensagemParaEnviar = `${cabecalhoVirt}🔴 *RED DEFINITIVO (3º MARTINGALE FALHOU)* 🔴\n\nCiclo de Martingales esgotado. Retornando à Entrada Principal no próximo ciclo.`;
                        estagioCiclo = 0;
                    }
                }
            }

            if (mensagemParaEnviar) {
                dispararMensagemTelegram(mensagemParaEnviar);
            }

            atualizarPreviewTelegram();

            if (oddSelecionadaAzul && bancoOdds[indice].valor === oddSelecionadaAzul) {
                atualizarTextoHeaderEficiencia(oddSelecionadaAzul);
            }
        }
    }

    function rolarContainer(idElemento, pixels) {
        const elemento = document.getElementById(idElemento);
        if (elemento) {
            elemento.scrollTop += pixels;
        }
    }

    function atualizarTextoHeaderEficiencia(valorOdd) {
        if (cacheRankingMapeado[valorOdd]) {
            eficienciaHeaderDisplay.innerText = cacheRankingMapeado[valorOdd];
            eficienciaHeaderDisplay.style.display = "inline-block";
        } else {
            eficienciaHeaderDisplay.innerText = `${valorOdd} - 0/0 ✅ (0%)`;
            eficienciaHeaderDisplay.style.display = "inline-block";
        }
    }

    function gerenciarCliqueOdd(valorOdd) {
        if (oddSelecionadaAzul === valorOdd) {
            oddSelecionadaAzul = null;
            eficienciaHeaderDisplay.innerText = "";
            eficienciaHeaderDisplay.style.display = "none";
        } else {
            oddSelecionadaAzul = valorOdd;
            atualizarTextoHeaderEficiencia(valorOdd);
            
            setTimeout(() => {
                let idFormatado = "rank-" + valorOdd.replace(/[\s.]/g, '');
                let elementoRanking = document.getElementById(idFormatado);
                if (elementoRanking) {
                    document.querySelectorAll('.balloon-row').forEach(r => r.classList.remove('focado'));
                    elementoRanking.classList.add('focado');
                    elementoRanking.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 60);
        }
        renderizarGrade(false);
    }

    function salvarEAtualizar(deveRolar) {
        localStorage.setItem('banco_odds_btts', JSON.stringify(bancoOdds));
        atualizarPainelDinamico(); 
        renderizarGrade(deveRolar);
        atualizarPreviewTelegram();
    }

    function renderizarGrade(deveRolar) {
        gridOdds.innerHTML = '';

        let contagemRepeticao = {};
        bancoOdds.forEach(item => {
            contagemRepeticao[item.valor] = (contagemRepeticao[item.valor] || 0) + 1;
        });

        let ultimaOddInserida = bancoOdds.length > 0 ? bancoOdds[bancoOdds.length - 1].valor : null;

        bancoOdds.forEach((item) => {
            const box = document.createElement('div');
            box.className = 'odd-box';
            box.setAttribute('onclick', `gerenciarCliqueOdd("${item.valor}")`);
            
            box.innerHTML = `
                <span class="odd-val-display">${item.valor}</span>
                <span class="odd-time-display">${item.tempo || '00:00'}</span>
                <input type="text" class="odd-placar-input" placeholder="- : -" value="${item.placar || ''}" oninput="tratarInputPlacar(event, '${item.id}')" onclick="event.stopPropagation();">
            `;
            
            if (item.status === 0 && listaFavoritosAtuais.includes(item.valor)) {
                box.classList.add('piscando-favorito');
            }

            if (ultimaOddInserida && item.valor === ultimaOddInserida && contagemRepeticao[ultimaOddInserida] >= 4) {
                box.classList.add('alerta-repeticao');
            }

            if (oddSelecionadaAzul && item.valor === oddSelecionadaAzul) {
                box.classList.add('selecionada-azul');
            }
            
            if (item.status === 1) box.classList.add('green');
            if (item.status === 2) box.classList.add('red');
            
            gridOdds.appendChild(box);
        });

        if (deveRolar) {
            setTimeout(() => {
                gridOdds.scrollTop = gridOdds.scrollHeight;
            }, 50);
        }
    }

    function atualizarPainelDinamico() {
        let statistics = {};
        let ultimaOddInserida = bancoOdds.length > 0 ? bancoOdds[bancoOdds.length - 1].valor : null;

        bancoOdds.forEach(item => {
            if (!statistics[item.valor]) {
                statistics[item.valor] = { total: 0, greens: 0, reds: 0 };
            }
            statistics[item.valor].total++;
            if (item.status === 1) statistics[item.valor].greens++;
            if (item.status === 2) statistics[item.valor].reds++;
        });

        if (ultimaOddInserida) {
            document.getElementById('ultOddGreen').innerText = ultimaOddInserida;
            let historicoCasas = [];

            for (let i = 0; i < bancoOdds.length - 1; i++) {
                if (bancoOdds[i].valor === ultimaOddInserida) {
                    let contadorCasas = 0;
                    let encontrouGreen = false;

                    for (let j = i + 1; j < bancoOdds.length; j++) {
                        contadorCasas++;
                        if (bancoOdds[j].status === 1) {
                            encontrouGreen = true;
                            break; 
                        }
                    }
                    if (encontrouGreen) {
                        historicoCasas.push(`${contadorCasas}ª Casa`);
                    }
                }
            }

            if (historicoCasas.length > 0) {
                let exibicao = historicoCasas.slice(-3).join(' | ');
                document.getElementById('historicoSequencia').innerText = exibicao;
                document.getElementById('historicoSequencia').style.color = "var(--color-green)";
            } else {
                document.getElementById('historicoSequencia').innerText = "Sem histórico de Green no passado";
                document.getElementById('historicoSequencia').style.color = "var(--text-muted)";
            }
        } else {
            document.getElementById('ultOddGreen').innerText = "-";
            document.getElementById('historicoSequencia').innerText = "Insira uma odd para analisar";
            document.getElementById('historicoSequencia').style.color = "var(--text-muted)";
        }

        let ranking = [];
        for (let valor in statistics) {
            let dados = statistics[valor];
            let totalValidados = dados.greens + dados.reds;
            let pctAproveitamento = totalValidados > 0 ? (dados.greens / totalValidados) * 100 : 0;

            if (totalValidados > 0) {
                ranking.push({
                    valor: valor,
                    greens: dados.greens,
                    tot: totalValidados,
                    pct: pctAproveitamento
                });
            }
        }

        ranking.sort((a, b) => b.pct - a.pct || b.greens - a.greens);
        listaFavoritosAtuais = ranking.filter(r => r.pct >= 80).map(r => r.valor);

        cacheRankingMapeado = {};
        rankingContainer.innerHTML = '';

        if (ranking.length === 0) {
            rankingContainer.innerHTML = '<div class="balloon-row"><span class="balloon-label" style="text-align:center; width:100%;">Nenhum padrão registrado ainda</span></div>';
        } else {
            ranking.forEach((dadosRanking, idx) => {
                const linha = document.createElement('div');
                linha.className = 'balloon-row';
                
                let idLimpo = "rank-" + dadosRanking.valor.replace(/[\s.]/g, '');
                linha.setAttribute('id', idLimpo);
                
                let corPercentual = "var(--text-muted)";
                if(dadosRanking.pct === 100) corPercentual = "var(--color-green)";
                else if(dadosRanking.pct >= 70) corPercentual = "var(--color-yellow)";
                else if(dadosRanking.pct > 0) corPercentual = "var(--color-red)";

                let stringEficienciaFormatada = `${idx + 1}° ${dadosRanking.valor} . ${dadosRanking.greens}/${dadosRanking.tot} ✅ (${Math.round(dadosRanking.pct)}%)`;
                cacheRankingMapeado[dadosRanking.valor] = stringEficienciaFormatada;

                linha.innerHTML = `
                    <span class="balloon-label">${idx + 1}º: ${dadosRanking.valor}</span>
                    <span class="balloon-value" style="color: ${corPercentual};">
                        ${dadosRanking.greens}/${dadosRanking.tot} ✅ 
                        <span style="font-size: 11px; margin-left: 4px; font-weight: 800;">(${Math.round(dadosRanking.pct)}%)</span>
                    </span>
                `;
                rankingContainer.appendChild(linha);
            });
        }
    }

    function limparHistorico() {
        if (confirm("Tem certeza que deseja apagar permanentemente todas as odds salvas?")) {
            bancoOdds = [];
            oddSelecionadaAzul = null;
            estagioCiclo = 0;
            eficienciaHeaderDisplay.innerText = "";
            eficienciaHeaderDisplay.style.display = "none";
            salvarEAtualizar(false);
        }
    }
</script>
